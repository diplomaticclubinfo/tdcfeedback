<!--
============================================================================
 SETUP (once): this page needs a Firebase project with Authentication
 (Email/Password) and Firestore Database enabled — no Cloud Functions, no
 Storage, no billing plan, no CLI.

 1. Fill in FIREBASE CONFIG below (Firebase Console → Project Settings →
    Your apps → Web app). Use the SAME config in your feedback.html file.
 2. Paste the rules block below into Firebase Console → Firestore
    Database → Rules → Publish. This is the real security layer.
 3. Host this file anywhere (Firebase Hosting, Netlify, your own server,
    or even just open it locally) — e.g. yoursite.com/admin.html
 4. Open it, click "First-time setup?" and create your Admin account.

⇩⇩⇩ PASTE INTO FIRESTORE RULES ⇩⇩⇩

rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn() { return request.auth != null; }
    function myData() { return get(/databases/$(database)/documents/users/$(request.auth.uid)).data; }
    function isAdmin() { return signedIn() && myData().active == true && myData().role == 'admin'; }
    function isUser() { return signedIn() && myData().active == true && myData().role == 'user'; }
    function myLocations() { return myData().assignedLocationIds; }

    match /feedback/{id} {
      allow create: if request.resource.data.status == 'new'
        && request.resource.data.locationId is string
        && request.resource.data.keys().hasAll(['feedbackId','locationId','locationName','dateOfVisit','ratings','submittedAt'])
        && request.resource.data.keys().size() <= 80
        && request.resource.data.get('likedBest', '').size() <= 4000
        && request.resource.data.get('improvementSuggestion', '').size() <= 4000;
      allow read: if isAdmin() || (isUser() && resource.data.locationId in myLocations());
      allow update, delete: if isAdmin();
    }
    match /locations/{id} {
      allow read: if resource.data.active == true || isAdmin() || isUser();
      allow write: if isAdmin();
    }
    match /users/{uid} {
      allow read: if isAdmin() || (signedIn() && request.auth.uid == uid);
      allow create: if isAdmin()
        || (signedIn() && request.auth.uid == uid && request.resource.data.role == 'admin'
            && !exists(/databases/$(database)/documents/settings/bootstrap));
      allow update: if isAdmin();
      allow delete: if isAdmin();
    }
    match /emailRecipients/{id} { allow read, write: if isAdmin(); }
    match /settings/bootstrap {
      allow read: if true;
      allow create: if signedIn() && !exists(/databases/$(database)/documents/settings/bootstrap);
      allow update, delete: if isAdmin();
    }
    match /settings/{id} {
      allow read: if true;
      allow write: if isAdmin();
    }
    match /auditLogs/{id} {
      allow read: if isAdmin();
      allow create: if isAdmin();
      allow update, delete: if false;
    }
    match /counters/{id} {
      allow read: if true;
      allow create: if request.resource.data.value == 1;
      allow update: if request.resource.data.value == resource.data.value + 1;
      allow delete: if false;
    }
    match /{document=**} { allow read, write: if false; }
  }
}

⇧⇧⇧ END OF FIRESTORE RULES ⇧⇧⇧

 Note: this admin page does not send automatic email notifications when
 feedback comes in (that needs a small server-side piece, since it must
 keep an SMTP password secret). The Email Destinations page still lets you
 record who should be notified for each location — check the Dashboard
 regularly, or ask for the Cloud Functions edition if you want automatic
 email alerts.
============================================================================
-->

// A second, independent Firebase app instance — used ONLY so an Admin can

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
function toast(msg, type = "") {
  const wrap = document.getElementById("toastWrap");
  const t = document.createElement("div");
  t.className = "toast " + type; t.textContent = msg;
  wrap.appendChild(t); setTimeout(() => t.remove(), 4500);
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function fmtDate(d) {
  if (!d) return "-";
  if (typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d)) { const [y,m,da]=d.split("-"); return `${da}/${m}/${y}`; }
  const dt = d.toDate ? d.toDate() : new Date(d);
  if (isNaN(dt)) return String(d);
  return dt.toLocaleDateString("en-GB", { day:"2-digit", month:"2-digit", year:"numeric", timeZone:"Asia/Qatar" });
}
function fmtDateTime(d) {
  if (!d) return "-";
  const dt = d.toDate ? d.toDate() : new Date(d);
  if (isNaN(dt)) return "-";
  return dt.toLocaleString("en-GB", { timeZone:"Asia/Qatar", day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
}
// For sorting query results by submittedAt in the browser instead of asking
// Firestore to (Firestore needs a composite index to combine a where()
// filter with orderBy() on a different field — sorting here avoids ever
// needing one).
function tsMillis(t) {
  if (!t) return 0;
  if (t.toMillis) return t.toMillis();
  if (t.toDate) return t.toDate().getTime();
  const n = new Date(t).getTime();
  return isNaN(n) ? 0 : n;
}
function openModal(html) {
  document.getElementById("modalRoot").innerHTML = `<div class="modal-bg" id="modalBg"><div class="modal">${html}</div></div>`;
  document.getElementById("modalBg").addEventListener("click", (e) => { if (e.target.id === "modalBg") closeModal(); });
}
function closeModal() { document.getElementById("modalRoot").innerHTML = ""; }
function csvEscape(v) { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; }
function downloadFile(filename, content, mime = "application/octet-stream") {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
// ---------------------------------------------------------------------------
// The guest questionnaire is fully admin-configurable (Settings → Questionnaire
// Builder): header text, every question, and the thank-you message. This is

// settings/questionnaire. Location and Date of Visit are intentionally NOT
// part of this list — they are fixed at the top of the guest form because QR
// routing, per-location reports and date filters depend on them.
// ---------------------------------------------------------------------------
const DEFAULT_QUESTIONNAIRE = {
  headerTitle: { en: "We appreciate your feedback", ar: "نقدّر ملاحظاتكم" },
  headerMessage: { en: "Please take a moment to share your comments by completing this short form.", ar: "يرجى تخصيص بضع دقائق لمشاركة ملاحظاتكم من خلال تعبئة هذا النموذج القصير." },
  footerTitle: { en: "Thank you for your constructive feedback!", ar: "شكرًا لملاحظاتكم البنّاءة!" },
  footerMessage: { en: "It genuinely helps us improve our service for you and every guest after you.", ar: "هذا يساعدنا فعليًا على تحسين خدماتنا لكم ولكل ضيف بعدكم." },
  fields: [
    { id: "serverName", type: "text", required: false, inputType: "text",
      label: { en: "Server's Name", ar: "اسم النادل" },
      placeholder: { en: "If you remember it — totally optional", ar: "إذا كنت تتذكره — اختياري تمامًا" } },
    { id: "recommendation", type: "choice", required: true,
      label: { en: "Would you recommend us to your friends and family?", ar: "هل توصي بنا لأصدقائك وعائلتك؟" },
      options: [{ en: "Yes", ar: "نعم" }, { en: "No", ar: "لا" }] },
    { id: "heardAboutUs", type: "choice", required: true,
      label: { en: "How did you hear about us?", ar: "كيف سمعت عنا؟" },
      options: [
        { en: "Friends", ar: "أصدقاء" },
        { en: "Newspaper & Magazines", ar: "الصحف والمجلات" },
        { en: "Social Media", ar: "وسائل التواصل الاجتماعي" },
        { en: "Others", ar: "أخرى" },
      ] },
    { id: "menuSelection", type: "rating", required: true, label: { en: "Menu Selection", ar: "تشكيلة القائمة" } },
    { id: "foodQuality", type: "rating", required: true, label: { en: "Food Quality", ar: "جودة الطعام" } },
    { id: "service", type: "rating", required: true, label: { en: "Service", ar: "الخدمة" } },
    { id: "atmosphere", type: "rating", required: true, label: { en: "Atmosphere / Ambiance", ar: "الأجواء" } },
    { id: "valueForMoney", type: "rating", required: true, label: { en: "Value for Money", ar: "القيمة مقابل السعر" } },
    { id: "overallExperience", type: "rating", required: true, label: { en: "Overall Experience", ar: "التجربة الإجمالية" } },
    { id: "likedBest", type: "textarea", required: false,

      placeholder: { en: "Tell us what stood out…", ar: "أخبرنا بما لفت انتباهك…" } },
    { id: "improvementSuggestion", type: "textarea", required: false,
      label: { en: "What could we do to make your experience even better?", ar: "ما الذي يمكننا فعله لتحسين تجربتك أكثر؟" },
      placeholder: { en: "We'd love to hear your suggestions…", ar: "يسعدنا سماع اقتراحاتكم…" } },
    { id: "guestName", type: "text", required: false, inputType: "text",

    { id: "contactNumber", type: "text", required: false, inputType: "tel",
      label: { en: "Contact No.", ar: "رقم التواصل" }, placeholder: { en: "Phone number", ar: "رقم الهاتف" } },
    { id: "guestEmail", type: "text", required: false, inputType: "email",
      label: { en: "Email", ar: "البريد الإلكتروني" }, placeholder: { en: "you@example.com", ar: "you@example.com" } },

};
const cloneQ = (q) => JSON.parse(JSON.stringify(q));

// Bilingual helpers. Every piece of guest-facing text is stored as { en, ar }.
// en()/ar() also accept a plain string, from before Arabic support existed.
const en = (v) => (v && typeof v === "object") ? (v.en || "") : (v || "");
const ar = (v) => (v && typeof v === "object") ? (v.ar || "") : "";
const pair = (v) => ({ en: en(v), ar: ar(v) });

// Upgrades a questionnaire saved before Arabic support (plain strings) into
// the bilingual shape. For anything the admin never changed from the built-in
// default wording, the matching default Arabic is filled in automatically —
// everything else keeps an empty Arabic side (guests then simply see English
// until it's translated).
function normalizeQuestionnaire(q) {
  const D = DEFAULT_QUESTIONNAIRE;
  const withDefaultAr = (val, defVal) => { const p = pair(val); if (!p.ar && defVal && p.en.trim() === en(defVal).trim()) p.ar = ar(defVal); return p; };
  const out = {
    headerTitle: withDefaultAr(q.headerTitle, D.headerTitle),
    headerMessage: withDefaultAr(q.headerMessage, D.headerMessage),
    footerTitle: withDefaultAr(q.footerTitle, D.footerTitle),
    footerMessage: withDefaultAr(q.footerMessage, D.footerMessage),
    fields: (q.fields || []).map((f) => {
      const def = D.fields.find((x) => x.id === f.id);
      const nf = { ...f, label: withDefaultAr(f.label, def && def.label) };
      if (f.type === "text" || f.type === "textarea") nf.placeholder = withDefaultAr(f.placeholder, def && def.placeholder);
      if (f.type === "choice") {
        nf.options = (f.options || []).map((o) => {
          const defOpt = def && (def.options || []).find((d) => en(d).trim().toLowerCase() === en(o).trim().toLowerCase());
          return withDefaultAr(o, defOpt);
        });
      }
      return nf;
    }),
  };
  return out;
}

function catLabel(k) {
  const found = ((state.questionnaire || DEFAULT_QUESTIONNAIRE).fields).find((f) => f.id === k);
  if (found) return en(found.label);
  return String(k).replace(/([A-Z])/g, " $1").replace(/^./, (c) => c.toUpperCase()).trim();
}
function toCamelId(label, existingIds) {
  let base = label.trim().replace(/[^a-zA-Z0-9 ]/g, "").split(/\s+/).filter(Boolean)
    .map((w, i) => i === 0 ? w.charAt(0).toLowerCase() + w.slice(1) : w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join("");
  if (!base) base = "question";
  let id = base, n = 2;
  while (existingIds.includes(id)) { id = base + n; n++; }
  return id;
}
async function loadQuestionnaire() {
  try {
    const snap = await Fs.getDoc(Fs.doc(db, "settings", "questionnaire"));
    if (snap.exists()) {
      const d = snap.data();
      if (Array.isArray(d.fields) && d.fields.length) {
        state.questionnaire = normalizeQuestionnaire({
          headerTitle: d.headerTitle || D0.headerTitle, headerMessage: d.headerMessage || D0.headerMessage,
          footerTitle: d.footerTitle || D0.footerTitle, footerMessage: d.footerMessage || D0.footerMessage,
          fields: d.fields,
        });
        return;
      }
      // Migrate from the earliest "rating categories only" version, if that's what was saved.
      if (Array.isArray(d.ratingCategories) && d.ratingCategories.length) {
        const q = cloneQ(DEFAULT_QUESTIONNAIRE);
        const ratings = d.ratingCategories.map((c) => ({ id: c.id, type: "rating", label: c.label, required: true }));
        const nonRatings = q.fields.filter((f) => f.type !== "rating");
        const at = nonRatings.findIndex((f) => f.id === "likedBest");
        q.fields = [...nonRatings.slice(0, at), ...ratings, ...nonRatings.slice(at)];
        state.questionnaire = normalizeQuestionnaire(q);
        return;
      }
    }
  } catch (e) {}
  state.questionnaire = cloneQ(DEFAULT_QUESTIONNAIRE);
}

async function viewFeedbackDetail(main, id) {

  // Render every question currently configured (in the admin's chosen order),
  // then any answers this record holds for questions that have since been

  const knownIds = new Set(qFields.map((f) => f.id));
  const SYSTEM_KEYS = new Set(["feedbackId","locationId","locationName","dateOfVisit","ratings","submittedAt","updatedAt","status","createdBy","deleted","deletedAt","deletedBy","editedBy","editHistory"]);
  const orphanKeys = Object.keys(r).filter((k) => !SYSTEM_KEYS.has(k) && !knownIds.has(k) && !(k.endsWith("Other") && knownIds.has(k.slice(0, -5))));
  const orphanRatingKeys = Object.keys(r.ratings || {}).filter((k) => !knownIds.has(k));
  const label = (f) => esc(en(f.label).replace(/\{location\}/g, r.locationName || "this location"));

    if (f.type === "rating") return `<tr><th style="width:40%">${label(f)}</th><td><span class="rating-chip ${r.ratings?.[f.id]}">${r.ratings?.[f.id] || "-"}</span></td></tr>`;

    return `<tr><th style="width:40%">${label(f)}</th><td>${esc(r[f.id] || "-")}</td></tr>`;
  };
  const tableFields = qFields.filter((f) => f.type !== "textarea");
  const longFields = qFields.filter((f) => f.type === "textarea");
  const removedBadge = ` <span class="badge gray" style="margin-left:4px">removed question</span>`;
  main.innerHTML = `
    <div class="no-print" style="margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-outline btn-sm" id="backBtn">← Back to list</button>

        await Fs.updateDoc(Fs.doc(db,"users",user.id), { fullName, role, assignedLocationIds: role==="admin"?[]:assignedLocationIds, updatedAt: Fs.serverTimestamp() });
        await writeAudit("User edited", user.email);

        const cred = await Auth.createUserWithEmailAndPassword(secondaryAuth, email, password);
        await Fs.setDoc(Fs.doc(db,"users",cred.user.uid), { fullName: fullName||email, email, role, assignedLocationIds: role==="admin"?[]:assignedLocationIds, active: true, createdAt: Fs.serverTimestamp(), updatedAt: Fs.serverTimestamp(), lastLoginAt: null });
        await secondaryAuth.signOut();
        await writeAudit("User created", `${email} (${role})`);
      }
      toast("User saved.", "success"); closeModal(); router();

  });

async function viewBackup(main) {
  main.innerHTML = `
    <div class="panel card"><h3>Backup Now</h3>
      <p style="color:var(--ink-soft);font-size:13px">Downloads a JSON backup of feedback, locations, email destinations and settings (excludes login passwords).</p>
      <button class="btn btn-gold" id="backupBtn">Backup Now</button>
      <div id="backupResult" style="margin-top:12px;font-size:13.5px"></div>
    </div>
    <div class="panel card"><h3>Restore Backup</h3>
      <p style="color:var(--red);font-size:13.5px;font-weight:600">⚠ Restoring a backup may replace or modify existing system data. Please make sure you have created a current backup before continuing.</p>
      <input type="file" id="restoreFile" accept="application/json" style="margin-bottom:12px">
      <div id="restorePreview"></div>
    </div>`;
  document.getElementById("backupBtn").addEventListener("click", async () => {
    const btn = document.getElementById("backupBtn"); btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Backing up…`;
    try {
      const collections = ["feedback","locations","emailRecipients","settings"];
      const out = { createdAt: new Date().toISOString(), collections: {} }; let totalRecords = 0;
      for (const c of collections) { const snap = await Fs.getDocs(Fs.collection(db,c)); out.collections[c] = snap.docs.map((d)=>({id:d.id,data:d.data()})); totalRecords += out.collections[c].length; }
      const stamp = new Date().toISOString().replace(/[:.]/g,"-");
      downloadFile(`GuestFeedback_Backup_${stamp}.json`, JSON.stringify(out,null,2), "application/json");
      document.getElementById("backupResult").innerHTML = `<span class="badge green">Done</span> ${totalRecords} records backed up at ${new Date().toLocaleString()}.`;
      await writeAudit("Backup created", `${totalRecords} records`);
    } catch (err) { toast("Backup failed: " + err.message, "error"); }
    finally { btn.disabled = false; btn.textContent = "Backup Now"; }
  });
  document.getElementById("restoreFile").addEventListener("change", async (e) => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!data.collections || !data.collections.feedback) throw new Error("invalid");
      const counts = Object.fromEntries(Object.entries(data.collections).map(([k,v])=>[k,v.length]));
      document.getElementById("restorePreview").innerHTML = `
        <div class="card" style="padding:14px;margin-bottom:12px">
          <div><b>Backup date:</b> ${data.createdAt||"unknown"}</div>
          <div><b>Feedback records:</b> ${counts.feedback||0}</div>
          <div><b>Locations:</b> ${counts.locations||0}</div>
          <div><b>Email configurations:</b> ${counts.emailRecipients||0}</div>
        </div>
        <button class="btn btn-outline" id="mergeBtn">Merge Data (add missing only)</button>
        <button class="btn btn-danger" id="replaceBtn" style="margin-left:10px">Replace Data</button>`;
      document.getElementById("mergeBtn").addEventListener("click", () => runRestore(data, "merge"));
      document.getElementById("replaceBtn").addEventListener("click", () => runRestore(data, "replace"));
    } catch (err) { document.getElementById("restorePreview").innerHTML = `<p style="color:var(--red)">This file is not a valid backup and cannot be restored.</p>`; }
  });
}
async function runRestore(data, mode) {
  if (!confirm(mode==="replace" ? "This will REPLACE existing records with the backup. Continue?" : "This will ADD missing records from the backup without deleting existing data. Continue?")) return;
  let written = 0;
  for (const [coll, docs] of Object.entries(data.collections)) {
    for (const { id, data: docData } of docs) {
      const ref = Fs.doc(db, coll, id);
      if (mode === "merge") { const existing = await Fs.getDoc(ref); if (existing.exists()) continue; }
      await Fs.setDoc(ref, docData); written++;
    }
  }
  await writeAudit("Restore performed", `${mode}: ${written} records written`);
  toast(`Restore complete. ${written} records written.`, "success");
  loadLocations();
}

      emailjsPublicKey: document.getElementById("sEjsKey").value.trim(),

    }, { merge: true });

  });

  // ---- Questionnaire Builder ----
  const TYPE_LABELS = { text: "Short text", textarea: "Long text", choice: "Choice", rating: "Rating" };
  let workingQ = cloneQ(state.questionnaire);
  const fillTexts = () => {
    document.getElementById("qHeaderTitle").value = en(workingQ.headerTitle); document.getElementById("qHeaderTitleAr").value = ar(workingQ.headerTitle);
    document.getElementById("qHeaderMessage").value = en(workingQ.headerMessage); document.getElementById("qHeaderMessageAr").value = ar(workingQ.headerMessage);
    document.getElementById("qFooterTitle").value = en(workingQ.footerTitle); document.getElementById("qFooterTitleAr").value = ar(workingQ.footerTitle);
    document.getElementById("qFooterMessage").value = en(workingQ.footerMessage); document.getElementById("qFooterMessageAr").value = ar(workingQ.footerMessage);
  };
  fillTexts();

  function renderFieldsEditor() {
    const list = document.getElementById("qFieldsList");
    const n = workingQ.fields.length;
    list.innerHTML = workingQ.fields.map((f, i) => `
      <div class="card" style="padding:14px;margin-bottom:10px">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
          <span class="badge gray">${i + 1}. ${TYPE_LABELS[f.type] || f.type}</span>
          <label style="display:flex;align-items:center;gap:6px;font-weight:500;font-size:13px;white-space:nowrap;margin:0;margin-inline-start:auto">
            <input type="checkbox" class="qReq" data-i="${i}" style="width:auto" ${f.required ? "checked" : ""}> Required
          </label>
        </div>
        <div class="bi-grid">
          <div><label>Question — English</label><input class="qLabel" data-i="${i}" value="${esc(en(f.label))}"></div>
          <div><label>Question — العربية</label><input class="qLabelAr ar-input" data-i="${i}" dir="rtl" value="${esc(ar(f.label))}"></div>
        </div>
        ${f.type === "choice" ? `<div class="bi-grid" style="margin-top:8px">
            <div><label>Answer options — English</label><input class="qOpts" data-i="${i}" value="${esc((f.options || []).map(en).join(", "))}" placeholder="Option 1, Option 2, Others"></div>
            <div><label>Answer options — العربية (same order)</label><input class="qOptsAr ar-input" data-i="${i}" dir="rtl" value="${esc((f.options || []).map(ar).join("، "))}" placeholder="الخيار 1، الخيار 2، أخرى"></div>
          </div>
          <div style="font-size:12px;color:var(--ink-soft);margin:6px 0 8px">Separate options with commas (the Arabic comma ، also works). Keep the Arabic in the <b>same order</b> as the English — the first Arabic option is the translation of the first English one, and so on. Include an option named <b>Others</b> to automatically show a "Please specify" box. Answers are always saved in English.</div>` : ""}
        ${f.type === "text" || f.type === "textarea" ? `<div class="bi-grid" style="margin-top:8px">
            <div><label>Hint text — English (optional)</label><input class="qPh" data-i="${i}" value="${esc(en(f.placeholder))}" placeholder="Shown inside the empty answer box"></div>
            <div><label>Hint text — العربية (optional)</label><input class="qPhAr ar-input" data-i="${i}" dir="rtl" value="${esc(ar(f.placeholder))}"></div>
          </div>` : ""}
        ${f.type === "text" ? `<select class="qIn" data-i="${i}" style="margin:8px 0" aria-label="Answer type">
            <option value="text" ${(f.inputType || "text") === "text" ? "selected" : ""}>Plain text</option>
            <option value="email" ${f.inputType === "email" ? "selected" : ""}>Email address (validated)</option>
            <option value="tel" ${f.inputType === "tel" ? "selected" : ""}>Phone number</option>
          </select>` : ""}
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-outline btn-sm qUp" data-i="${i}" ${i === 0 ? "disabled" : ""}>↑ Move up</button>
          <button class="btn btn-outline btn-sm qDown" data-i="${i}" ${i === n - 1 ? "disabled" : ""}>↓ Move down</button>
          <button class="btn btn-outline btn-sm qDel" data-i="${i}" style="color:var(--red);margin-left:auto">Delete</button>
        </div>
      </div>`).join("") || `<p style="color:var(--ink-soft);font-size:13px">No questions yet — add one below.</p>`;

    const setPair = (i, key, side, value) => { const f = workingQ.fields[i]; f[key] = { ...pair(f[key]), [side]: value }; };
    // Zips the English and Arabic option boxes together by position into [{en, ar}, ...]
    const syncOptions = (i) => {
      const split = (str) => str.split(/[,،]/).map((x) => x.trim()).filter(Boolean);
      const enOpts = split(list.querySelector(`.qOpts[data-i="${i}"]`).value);
      const arOpts = split(list.querySelector(`.qOptsAr[data-i="${i}"]`).value);
      workingQ.fields[i].options = enOpts.map((e, k) => ({ en: e, ar: arOpts[k] || "" }));
    };
    list.querySelectorAll(".qLabel").forEach((el) => el.addEventListener("input", (e) => setPair(+e.target.dataset.i, "label", "en", e.target.value)));
    list.querySelectorAll(".qLabelAr").forEach((el) => el.addEventListener("input", (e) => setPair(+e.target.dataset.i, "label", "ar", e.target.value)));
    list.querySelectorAll(".qReq").forEach((el) => el.addEventListener("change", (e) => { workingQ.fields[+e.target.dataset.i].required = e.target.checked; }));
    list.querySelectorAll(".qOpts, .qOptsAr").forEach((el) => el.addEventListener("input", (e) => syncOptions(+e.target.dataset.i)));
    list.querySelectorAll(".qPh").forEach((el) => el.addEventListener("input", (e) => setPair(+e.target.dataset.i, "placeholder", "en", e.target.value)));
    list.querySelectorAll(".qPhAr").forEach((el) => el.addEventListener("input", (e) => setPair(+e.target.dataset.i, "placeholder", "ar", e.target.value)));
    list.querySelectorAll(".qIn").forEach((el) => el.addEventListener("change", (e) => { workingQ.fields[+e.target.dataset.i].inputType = e.target.value; }));
    list.querySelectorAll(".qUp").forEach((b) => b.addEventListener("click", () => { const i = +b.dataset.i; [workingQ.fields[i - 1], workingQ.fields[i]] = [workingQ.fields[i], workingQ.fields[i - 1]]; renderFieldsEditor(); }));
    list.querySelectorAll(".qDown").forEach((b) => b.addEventListener("click", () => { const i = +b.dataset.i; [workingQ.fields[i + 1], workingQ.fields[i]] = [workingQ.fields[i], workingQ.fields[i + 1]]; renderFieldsEditor(); }));
    list.querySelectorAll(".qDel").forEach((b) => b.addEventListener("click", () => {
      const f = workingQ.fields[+b.dataset.i];
      if (!confirm(`Delete this question?\n\n"${en(f.label)}"\n\nGuests will no longer be asked it. Answers already collected are kept.`)) return;
      workingQ.fields.splice(+b.dataset.i, 1); renderFieldsEditor();
    }));
  }
  renderFieldsEditor();

  document.getElementById("qAddBtn").addEventListener("click", () => {
    const labelEn = document.getElementById("qNewLabel").value.trim();
    const labelAr = document.getElementById("qNewLabelAr").value.trim();
    if (!labelEn) return toast("Type the question in English first (add the Arabic version too if you have it).", "error");
    const type = document.getElementById("qNewType").value;
    const field = { id: toCamelId(labelEn, workingQ.fields.map((f) => f.id)), type, label: { en: labelEn, ar: labelAr }, required: type === "rating" };
    if (type === "choice") field.options = [{ en: "Option 1", ar: "" }, { en: "Option 2", ar: "" }];
    if (type === "text") field.inputType = "text";
    if (type === "text" || type === "textarea") field.placeholder = { en: "", ar: "" };
    workingQ.fields.push(field);
    document.getElementById("qNewLabel").value = ""; document.getElementById("qNewLabelAr").value = "";
    renderFieldsEditor();
    toast("Question added at the bottom — use ↑ to move it where you want.", "success");

  document.getElementById("qNewLabel").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); document.getElementById("qAddBtn").click(); } });

  document.getElementById("qResetBtn").addEventListener("click", () => {
    if (!confirm("Reset the whole questionnaire (header, questions, thank-you message) back to the original default? You still need to click Save afterwards.")) return;
    workingQ = cloneQ(DEFAULT_QUESTIONNAIRE);
    fillTexts();
    renderFieldsEditor();
  });

  document.getElementById("qSaveBtn").addEventListener("click", async () => {
    const v = (id) => document.getElementById(id).value.trim();
    workingQ.headerTitle = { en: v("qHeaderTitle"), ar: v("qHeaderTitleAr") };
    workingQ.headerMessage = { en: v("qHeaderMessage"), ar: v("qHeaderMessageAr") };
    workingQ.footerTitle = { en: v("qFooterTitle"), ar: v("qFooterTitleAr") };
    workingQ.footerMessage = { en: v("qFooterMessage"), ar: v("qFooterMessageAr") };
    if (!workingQ.headerTitle.en) return toast("The English header title can't be empty.", "error");
    if (workingQ.fields.some((f) => !en(f.label).trim())) return toast("Every question needs its English text (the Arabic is optional).", "error");
    if (workingQ.fields.some((f) => f.type === "choice" && (f.options || []).length < 2)) return toast("Choice questions need at least 2 answer options.", "error");
    const badOpts = workingQ.fields.find((f) => f.type === "choice" && (f.options || []).some((o) => ar(o)) && (f.options || []).some((o) => !ar(o)));
    if (badOpts) toast(`Heads up: "${en(badOpts.label)}" has Arabic for only some of its options — the others will show in English to Arabic guests. Check the Arabic list has the same number of items as the English.`, "error");
    const btn = document.getElementById("qSaveBtn"); btn.disabled = true;
    try {
      await Fs.setDoc(Fs.doc(db, "settings", "questionnaire"), {
        headerTitle: workingQ.headerTitle, headerMessage: workingQ.headerMessage,
        footerTitle: workingQ.footerTitle, footerMessage: workingQ.footerMessage,
        fields: workingQ.fields, updatedAt: Fs.serverTimestamp(),
      }, { merge: true });
      state.questionnaire = cloneQ(workingQ);
      await writeAudit("Questionnaire updated", `${workingQ.fields.length} questions`);
      toast("Questionnaire saved. New guest submissions will use it.", "success");
    } catch (err) { console.error(err); toast("Could not save: " + err.message, "error"); }
    finally { btn.disabled = false; }
  });
}

  </table></div></div>`;
}
