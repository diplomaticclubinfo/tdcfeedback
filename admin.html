<!--
============================================================================
 SETUP (once): this page needs a Firebase project with Authentication
 (Email/Password) and Firestore Database enabled — no Cloud Functions, no
 Storage, no billing plan, no CLI.

 1. Fill in FIREBASE CONFIG below (Firebase Console → Project Settings →
    Your apps → Web app). Use the SAME config in your feedback.html file.
 2. Paste the rules block below into Firebase Console → Firestore
    Database → Rules → Publish. This is the real security layer.
 3. Host this file anywhere (Firebase Hosting, Netlify, your own server,
    or even just open it locally) — e.g. yoursite.com/admin.html
 4. Open it, click "First-time setup?" and create your Admin account.

⇩⇩⇩ PASTE INTO FIRESTORE RULES ⇩⇩⇩

rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn() { return request.auth != null; }
    function myData() { return get(/databases/$(database)/documents/users/$(request.auth.uid)).data; }
    function isAdmin() { return signedIn() && myData().active == true && myData().role == 'admin'; }
    function isUser() { return signedIn() && myData().active == true && myData().role == 'user'; }
    function myLocations() { return myData().assignedLocationIds; }

    match /feedback/{id} {
      allow create: if request.resource.data.status == 'new'
        && request.resource.data.locationId is string
        && request.resource.data.keys().hasAll(['feedbackId','locationId','locationName','dateOfVisit','ratings','submittedAt'])
        && request.resource.data.keys().size() <= 80
        && request.resource.data.get('likedBest', '').size() <= 4000
        && request.resource.data.get('improvementSuggestion', '').size() <= 4000;
      allow read: if isAdmin() || (isUser() && resource.data.locationId in myLocations());
      allow update, delete: if isAdmin();
    }
    match /locations/{id} {
      allow read: if resource.data.active == true || isAdmin() || isUser();
      allow write: if isAdmin();
    }
    match /users/{uid} {
      allow read: if isAdmin() || (signedIn() && request.auth.uid == uid);
      allow create: if isAdmin()
        || (signedIn() && request.auth.uid == uid && request.resource.data.role == 'admin'
            && !exists(/databases/$(database)/documents/settings/bootstrap));
      allow update: if isAdmin();
      allow delete: if isAdmin();
    }
    match /emailRecipients/{id} { allow read, write: if isAdmin(); }
    match /settings/bootstrap {
      allow read: if true;
      allow create: if signedIn() && !exists(/databases/$(database)/documents/settings/bootstrap);
      allow update, delete: if isAdmin();
    }
    match /settings/{id} {
      allow read: if true;
      allow write: if isAdmin();
    }
    match /auditLogs/{id} {
      allow read: if isAdmin();
      allow create: if isAdmin();
      allow update: if false;
      allow delete: if isAdmin();
    }
    match /counters/{id} {
      allow read: if true;
      allow create: if request.resource.data.value == 1;
      allow update: if request.resource.data.value == resource.data.value + 1;
      allow delete: if false;
    }
    match /{document=**} { allow read, write: if false; }
  }
}

⇧⇧⇧ END OF FIRESTORE RULES ⇧⇧⇧

 Note: this admin page does not send automatic email notifications when
 feedback comes in (that needs a small server-side piece, since it must
 keep an SMTP password secret). The Email Destinations page still lets you
 record who should be notified for each location — check the Dashboard
 regularly, or ask for the Cloud Functions edition if you want automatic
 email alerts.
============================================================================
-->

const app = initializeApp(firebaseConfig);

// A second, independent Firebase app instance — used ONLY so an Admin can
// create a new staff login without being signed out of their own session.

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
function toast(msg, type = "") {
  const wrap = document.getElementById("toastWrap");
  const t = document.createElement("div");
  t.className = "toast " + type; t.textContent = msg;
  wrap.appendChild(t); setTimeout(() => t.remove(), 4500);
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function fmtDate(d) {
  if (!d) return "-";
  if (typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d)) { const [y,m,da]=d.split("-"); return `${da}-${m}-${y}`; }
  const dt = d.toDate ? d.toDate() : new Date(d);
  if (isNaN(dt)) return String(d);
  return dt.toLocaleDateString("en-GB", { day:"2-digit", month:"2-digit", year:"numeric", timeZone:"Asia/Qatar" }).replace(/\//g, "-");
}
function fmtDateTime(d) {
  if (!d) return "-";
  const dt = d.toDate ? d.toDate() : new Date(d);
  if (isNaN(dt)) return "-";
  return dt.toLocaleString("en-GB", { timeZone:"Asia/Qatar", day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" }).replace(/(\d{2})\/(\d{2})\/(\d{4})/, "$1-$2-$3");
}
// For sorting query results by submittedAt in the browser instead of asking
// Firestore to (Firestore needs a composite index to combine a where()
// filter with orderBy() on a different field — sorting here avoids ever
// needing one).
function tsMillis(t) {
  if (!t) return 0;
  if (t.toMillis) return t.toMillis();
  if (t.toDate) return t.toDate().getTime();
  const n = new Date(t).getTime();
  return isNaN(n) ? 0 : n;
}
function openModal(html) {
  document.getElementById("modalRoot").innerHTML = `<div class="modal-bg" id="modalBg"><div class="modal">${html}</div></div>`;
  document.getElementById("modalBg").addEventListener("click", (e) => { if (e.target.id === "modalBg") closeModal(); });
}
function closeModal() { document.getElementById("modalRoot").innerHTML = ""; }
function csvEscape(v) { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; }
function downloadFile(filename, content, mime = "application/octet-stream") {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
// ---------------------------------------------------------------------------
// The guest questionnaire is fully admin-configurable (Settings → Questionnaire
// Builder): header text, every question, and the thank-you message. This is
// the built-in starting point used until an admin saves their own version to
// settings/questionnaire. Location and Date of Visit are intentionally NOT
// part of this list — they are fixed at the top of the guest form because QR
// routing, per-location reports and date filters depend on them.
// ---------------------------------------------------------------------------
const DEFAULT_QUESTIONNAIRE = {
  headerTitle: { en: "We appreciate your feedback", ar: "نقدّر ملاحظاتكم" },
  headerMessage: { en: "Please take a moment to share your comments by completing this short form.", ar: "يرجى تخصيص بضع دقائق لمشاركة ملاحظاتكم من خلال تعبئة هذا النموذج القصير." },
  footerTitle: { en: "Thank you for your constructive feedback!", ar: "شكرًا لملاحظاتكم البنّاءة!" },
  footerMessage: { en: "It genuinely helps us improve our service for you and every guest after you.", ar: "هذا يساعدنا فعليًا على تحسين خدماتنا لكم ولكل ضيف بعدكم." },
  fields: [
    { id: "serverName", type: "text", required: false, inputType: "text",
      label: { en: "Server's Name", ar: "اسم النادل" },
      placeholder: { en: "If you remember it — totally optional", ar: "إذا كنت تتذكره — اختياري تمامًا" } },
    { id: "recommendation", type: "choice", required: true,
      label: { en: "Would you recommend us to your friends and family?", ar: "هل توصي بنا لأصدقائك وعائلتك؟" },
      options: [{ en: "Yes", ar: "نعم" }, { en: "No", ar: "لا" }] },
    { id: "heardAboutUs", type: "choice", required: true,
      label: { en: "How did you hear about us?", ar: "كيف سمعت عنا؟" },
      options: [
        { en: "Friends", ar: "أصدقاء" },
        { en: "Newspaper & Magazines", ar: "الصحف والمجلات" },
        { en: "Social Media", ar: "وسائل التواصل الاجتماعي" },
        { en: "Others", ar: "أخرى" },
      ] },
    { id: "menuSelection", type: "rating", required: true, label: { en: "Menu Selection", ar: "تشكيلة القائمة" } },
    { id: "foodQuality", type: "rating", required: true, label: { en: "Food Quality", ar: "جودة الطعام" } },
    { id: "service", type: "rating", required: true, label: { en: "Service", ar: "الخدمة" } },
    { id: "atmosphere", type: "rating", required: true, label: { en: "Atmosphere / Ambiance", ar: "الأجواء" } },
    { id: "valueForMoney", type: "rating", required: true, label: { en: "Value for Money", ar: "القيمة مقابل السعر" } },
    { id: "overallExperience", type: "rating", required: true, label: { en: "Overall Experience", ar: "التجربة الإجمالية" } },
    { id: "likedBest", type: "textarea", required: false,
      label: { en: "What did you like best about {location}?", ar: "ما الذي أعجبك أكثر في {location}؟" },
      placeholder: { en: "Tell us what stood out…", ar: "أخبرنا بما لفت انتباهك…" } },
    { id: "improvementSuggestion", type: "textarea", required: false,
      label: { en: "What could we do to make your experience even better?", ar: "ما الذي يمكننا فعله لتحسين تجربتك أكثر؟" },
      placeholder: { en: "We'd love to hear your suggestions…", ar: "يسعدنا سماع اقتراحاتكم…" } },
    { id: "guestName", type: "text", required: false, inputType: "text",
      label: { en: "Name", ar: "الاسم" }, placeholder: { en: "Your name", ar: "اسمك" } },
    { id: "contactNumber", type: "text", required: false, inputType: "tel",
      label: { en: "Contact No.", ar: "رقم التواصل" }, placeholder: { en: "Phone number", ar: "رقم الهاتف" } },
    { id: "guestEmail", type: "text", required: false, inputType: "email",
      label: { en: "Email", ar: "البريد الإلكتروني" }, placeholder: { en: "you@example.com", ar: "you@example.com" } },
  ],
};
const cloneQ = (q) => JSON.parse(JSON.stringify(q));

// Bilingual helpers. Every piece of guest-facing text is stored as { en, ar }.
// en()/ar() also accept a plain string, from before Arabic support existed.
const en = (v) => (v && typeof v === "object") ? (v.en || "") : (v || "");
const ar = (v) => (v && typeof v === "object") ? (v.ar || "") : "";
const pair = (v) => ({ en: en(v), ar: ar(v) });

// Upgrades a questionnaire saved before Arabic support (plain strings) into
// the bilingual shape. For anything the admin never changed from the built-in
// default wording, the matching default Arabic is filled in automatically —
// everything else keeps an empty Arabic side (guests then simply see English
// until it's translated).
function normalizeQuestionnaire(q) {
  const D = DEFAULT_QUESTIONNAIRE;
  const withDefaultAr = (val, defVal) => { const p = pair(val); if (!p.ar && defVal && p.en.trim() === en(defVal).trim()) p.ar = ar(defVal); return p; };
  const out = {
    headerTitle: withDefaultAr(q.headerTitle, D.headerTitle),
    headerMessage: withDefaultAr(q.headerMessage, D.headerMessage),
    footerTitle: withDefaultAr(q.footerTitle, D.footerTitle),
    footerMessage: withDefaultAr(q.footerMessage, D.footerMessage),
    fields: (q.fields || []).map((f) => {
      const def = D.fields.find((x) => x.id === f.id);
      const nf = { ...f, label: withDefaultAr(f.label, def && def.label) };
      if (f.type === "text" || f.type === "textarea") nf.placeholder = withDefaultAr(f.placeholder, def && def.placeholder);
      if (f.type === "choice") {
        nf.options = (f.options || []).map((o) => {
          const defOpt = def && (def.options || []).find((d) => en(d).trim().toLowerCase() === en(o).trim().toLowerCase());
          return withDefaultAr(o, defOpt);
        });
      }
      return nf;
    }),
  };
  return out;
}

function catLabel(k) {
  const found = ((state.questionnaire || DEFAULT_QUESTIONNAIRE).fields).find((f) => f.id === k);
  if (found) return en(found.label);

}
function toCamelId(label, existingIds) {
  let base = label.trim().replace(/[^a-zA-Z0-9 ]/g, "").split(/\s+/).filter(Boolean)
    .map((w, i) => i === 0 ? w.charAt(0).toLowerCase() + w.slice(1) : w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join("");

  let id = base, n = 2;
  while (existingIds.includes(id)) { id = base + n; n++; }

}

// ---------------------------------------------------------------------------
// Notification routing. The guest form (which has no login) can only read the
// location records, not the private Email Destinations list — so whenever the
// destinations change, each location's own "notifyEmails" list is rebuilt as:
//   (emails typed directly on the location, kept in "extraEmails")
//   + (every ENABLED Email Destination assigned to that location).
// ---------------------------------------------------------------------------
function mergeEmails(...lists) {
  const seen = new Set(), out = [];
  lists.flat().forEach((e) => { const t = String(e || "").trim(), k = t.toLowerCase(); if (t && !seen.has(k)) { seen.add(k); out.push(t); } });
  return out;
}
async function syncNotifyEmails() {
  const recips = (await Fs.getDocs(Fs.collection(db, "emailRecipients"))).docs.map((d) => ({ id: d.id, ...d.data() }));
  await loadLocations();
  let changed = 0;
  for (const l of state.locations) {
    // Locations saved before this feature only ever had hand-typed addresses, so those become the "extra" list.
    const extra = Array.isArray(l.extraEmails) ? l.extraEmails : (l.notifyEmails || []);
    const merged = mergeEmails(extra, recips.filter((r) => r.active !== false && (r.locationIds || []).includes(l.id)).map((r) => r.email));
    const cur = l.notifyEmails || [];
    const same = merged.length === cur.length && merged.every((e, i) => e === cur[i]);
    if (!same || !Array.isArray(l.extraEmails)) {
      await Fs.updateDoc(Fs.doc(db, "locations", l.id), { notifyEmails: merged, extraEmails: extra });
      changed++;
    }
  }
  if (changed) await loadLocations();
  return changed;
}

// Bulk deletion helpers (used by the Feedback list and the Audit Log)
// ---------------------------------------------------------------------------
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
function plainData(v) { // Firestore timestamps -> readable text, so a backup file is human-friendly
  if (v && typeof v === "object") {
    if (typeof v.toDate === "function") return v.toDate().toISOString();
    if (Array.isArray(v)) return v.map(plainData);
    const o = {}; for (const k in v) o[k] = plainData(v[k]); return o;
  }
  return v;
}
async function deleteDocsInBatches(coll, ids, progress) {
  for (let i = 0; i < ids.length; i += 400) { // Firestore allows at most 500 changes per batch
    const batch = Fs.writeBatch(db);
    ids.slice(i, i + 400).forEach((id) => batch.delete(Fs.doc(db, coll, id)));
    await batch.commit();
    if (progress) progress(Math.min(i + 400, ids.length), ids.length);
  }
}
// One confirmation window for every kind of deletion: states exactly what will be
// deleted, optionally downloads a backup copy first, and makes large deletions
// require typing DELETE.
function confirmDeleteModal({ title, message, coll, count, requireTyping, backupFile, loadItems, onDone }) {
  openModal(`
    <h3 style="color:var(--red)">${esc(title)}</h3>
    <p style="font-size:14px;line-height:1.5">${message}</p>
    <label style="display:flex;align-items:center;gap:8px;font-weight:500;color:var(--ink);margin:12px 0"><input type="checkbox" id="cdBackup" style="width:auto" checked> Download a backup copy of these records first (recommended)</label>
    ${requireTyping ? `<div class="field"><label>Type <b>DELETE</b> to confirm</label><input id="cdType" autocomplete="off" placeholder="DELETE"></div>` : ""}
    <div id="cdStatus" style="font-size:13px;color:var(--ink-soft);min-height:18px"></div>
    <div class="modal-actions"><button class="btn btn-outline" id="cdCancel">Cancel</button><button class="btn btn-danger" id="cdGo" ${requireTyping ? "disabled" : ""}>Delete ${count == null ? "everything" : plural(count, "record", "records")}</button></div>`);
  const go = document.getElementById("cdGo"), status = document.getElementById("cdStatus");
  if (requireTyping) document.getElementById("cdType").addEventListener("input", (e) => { go.disabled = e.target.value.trim() !== "DELETE"; });
  document.getElementById("cdCancel").addEventListener("click", closeModal);
  go.addEventListener("click", async () => {
    go.disabled = true; document.getElementById("cdCancel").disabled = true; go.innerHTML = `<span class="spinner"></span> Working…`;
    try {
      status.textContent = "Collecting the records…";
      const items = await loadItems(); // [{ id, data }]
      if (!items.length) { closeModal(); return toast("There was nothing to delete.", "success"); }
      if (document.getElementById("cdBackup").checked) {
        const stamp = new Date().toISOString().replace(/[:.]/g, "-");
        downloadFile(`${backupFile}_deleted_${stamp}.json`, JSON.stringify(plainData(items.map((i) => ({ id: i.id, ...i.data }))), null, 2), "application/json");
      }
      await deleteDocsInBatches(coll, items.map((i) => i.id), (done, total) => { status.textContent = `Deleting… ${done} of ${total}`; });
      await onDone(items.map((i) => i.id));
      closeModal();
    } catch (err) {
      console.error(err);
      status.innerHTML = `<span style="color:var(--red)">Could not finish: ${esc(err.message || err)}</span>`;
      go.disabled = false; go.textContent = "Try again"; document.getElementById("cdCancel").disabled = false;
    }
  });
}

      toast("Could not load feedback: " + (err.message || err), "error");
    } finally {
      document.getElementById("fApply").disabled = false;
    }
  }
  function applyClientFilters(rows) {
    const search = document.getElementById("fSearch").value.trim().toLowerCase();
    const rec = document.getElementById("fRec").value, server = document.getElementById("fServer").value.trim().toLowerCase();
    return rows.filter((r) => {
      if (rec && r.recommendation !== rec) return false;
      if (server && !(r.serverName||"").toLowerCase().includes(server)) return false;
      if (search) { const hay=[r.feedbackId,r.locationName,r.serverName,r.guestName,r.contactNumber,r.guestEmail,r.likedBest,r.improvementSuggestion].join(" ").toLowerCase(); if (!hay.includes(search)) return false; }
      return true;
    });
  }
  function updateSelUI() {
    if (!isAdmin) return;
    const n = fbSelected.size, btn = document.getElementById("fDelSel");
    btn.disabled = n === 0; btn.textContent = `Delete selected (${n})`;
    const all = document.getElementById("fSelAll");
    all.checked = currentPageRows.length > 0 && currentPageRows.every((r) => fbSelected.has(r.feedbackId));
  }
  function renderRows() {
    fbPageSize = Number(document.getElementById("fPageSize").value);
    const filtered = applyClientFilters(fbCache);
    const totalPages = Math.max(1, Math.ceil(filtered.length / fbPageSize));
    fbPage = Math.min(fbPage, totalPages);
    const startIdx = (fbPage-1)*fbPageSize;
    const pageRows = filtered.slice(startIdx, startIdx+fbPageSize);
    currentPageRows = pageRows;
    document.getElementById("fbTbody").innerHTML = pageRows.length ? pageRows.map((r)=>`
      <tr>${isAdmin ? `<td><input type="checkbox" class="fSel" data-id="${esc(r.feedbackId)}" aria-label="Select ${esc(r.feedbackId)}" style="width:auto" ${fbSelected.has(r.feedbackId) ? "checked" : ""}></td>` : ""}<td>${r.feedbackId}</td><td>${fmtDate(r.dateOfVisit)}</td><td>${esc(r.locationName)}</td><td>${esc(r.serverName||"-")}</td>
      <td>${r.recommendation}</td><td><span class="rating-chip ${r.ratings?.overallExperience}">${r.ratings?.overallExperience||"-"}</span></td>
      <td>${esc(r.guestName||"-")}</td><td>${fmtDateTime(r.submittedAt)}</td><td><a href="#/feedback/${r.feedbackId}">View</a></td></tr>`).join("")
      : `<tr><td colspan="${isAdmin ? 10 : 9}">No feedback matches your search criteria.</td></tr>`;
    document.getElementById("fPageLbl").textContent = `Page ${fbPage} of ${totalPages} (${filtered.length} records)`;
    updateSelUI();
  }

  // ---- admin-only: select & delete ----
  async function afterFeedbackDeleted(ids, note) {
    const gone = new Set(ids);
    fbCache = fbCache.filter((r) => !gone.has(r.feedbackId));
    ids.forEach((id) => fbSelected.delete(id));
    await writeAudit("Feedback deleted", `${plural(ids.length, "record", "records")}${note ? " (" + note + ")" : ""}: ${ids.slice(0, 25).join(", ")}${ids.length > 25 ? ", …" : ""}`);
    toast(`${plural(ids.length, "feedback record", "feedback records")} deleted.`, "success");
    renderRows();
  }
  if (isAdmin) {
    document.getElementById("fbTbody").addEventListener("change", (e) => {
      if (!e.target.classList.contains("fSel")) return;
      e.target.checked ? fbSelected.add(e.target.dataset.id) : fbSelected.delete(e.target.dataset.id);
      updateSelUI();
    });
    document.getElementById("fSelAll").addEventListener("change", (e) => {
      currentPageRows.forEach((r) => e.target.checked ? fbSelected.add(r.feedbackId) : fbSelected.delete(r.feedbackId));
      renderRows();
    });
    document.getElementById("fSelMatching").addEventListener("click", () => {
      const rows = applyClientFilters(fbCache); rows.forEach((r) => fbSelected.add(r.feedbackId)); renderRows();
      toast(`${plural(rows.length, "record", "records")} selected (across all pages).`, "success");
    });
    document.getElementById("fSelNone").addEventListener("click", () => { fbSelected.clear(); renderRows(); });
    document.getElementById("fDelSel").addEventListener("click", () => {
      const ids = [...fbSelected];
      if (!ids.length) return;
      confirmDeleteModal({
        title: `Delete ${plural(ids.length, "selected record", "selected records")}?`,
        message: `You are about to permanently delete <b>${plural(ids.length, "feedback record", "feedback records")}</b>. This cannot be undone.`,
        coll: "feedback", count: ids.length, requireTyping: ids.length > 10, backupFile: "feedback",
        loadItems: async () => ids.map((id) => fbCache.find((r) => r.feedbackId === id)).filter(Boolean).map((r) => ({ id: r.feedbackId, data: r })),
        onDone: (deleted) => afterFeedbackDeleted(deleted),
      });
    });
    document.getElementById("fDelAll").addEventListener("click", () => {
      confirmDeleteModal({
        title: "Delete ALL feedback?",
        message: `This permanently deletes <b>every feedback record in the whole system</b> — for all locations and all dates, not just what is on screen. Locations, users, questions and settings are not touched. Feedback numbering keeps counting from where it was. <b>This cannot be undone.</b>`,
        coll: "feedback", count: null, requireTyping: true, backupFile: "feedback_ALL",
        loadItems: async () => (await Fs.getDocs(Fs.collection(db, "feedback"))).docs.map((d) => ({ id: d.id, data: d.data() })),
        onDone: async (deleted) => { fbCache = []; fbSelected.clear(); await afterFeedbackDeleted(deleted, "ALL feedback"); },
      });
    });
  }
  document.getElementById("fApply").addEventListener("click", runQuery);
  document.getElementById("fSearch").addEventListener("input", renderRows);
  document.getElementById("fRec").addEventListener("change", renderRows);
  document.getElementById("fServer").addEventListener("input", renderRows);
  document.getElementById("fPageSize").addEventListener("change", ()=>{fbPage=1;renderRows();});
  document.getElementById("fPrev").addEventListener("click", ()=>{if(fbPage>1){fbPage--;renderRows();}});
  document.getElementById("fNext").addEventListener("click", ()=>{fbPage++;renderRows();});
  document.getElementById("fClear").addEventListener("click", ()=>{["fSearch","fLocation","fFrom","fTo","fRec","fServer"].forEach((id)=>document.getElementById(id).value="");runQuery();});
  document.getElementById("fPrint").addEventListener("click", ()=>window.print());
  document.getElementById("fCsv").addEventListener("click", () => {
    const rows = applyClientFilters(fbCache);
    const qFields = state.questionnaire.fields;
    const header = ["Feedback ID","Date of Visit","Location", ...qFields.map((f)=>en(f.label).replace(/\{location\}/g,"[location]")), "Submitted At"];
    const cell = (r, f) => {
      if (f.type === "rating") return r.ratings?.[f.id] ?? "";
      let v = r[f.id] ?? "";
      if (f.type === "choice" && r[f.id + "Other"]) v += " — " + r[f.id + "Other"];
      return v;
    };
    const lines = [header.map(csvEscape).join(",")].concat(rows.map((r)=>[r.feedbackId,fmtDate(r.dateOfVisit),r.locationName, ...qFields.map((f)=>cell(r,f)), fmtDateTime(r.submittedAt)].map(csvEscape).join(",")));
    downloadFile(`feedback-export-${Date.now()}.csv`, "\uFEFF"+lines.join("\n"), "text/csv;charset=utf-8");
  });
  await runQuery();
}

// ---- Feedback detail ------------------------------------------------------
async function viewFeedbackDetail(main, id) {
  const snap = await Fs.getDoc(Fs.doc(db, "feedback", id));
  if (!snap.exists()) { main.innerHTML = `<div class="empty-state">Feedback record not found.</div>`; return; }
  const r = snap.data();
  if (state.role !== "admin" && !state.assignedLocationIds.includes(r.locationId)) { main.innerHTML = `<div class="empty-state">You do not have access to this feedback record.</div>`; return; }
  // Render every question currently configured (in the admin's chosen order),
  // then any answers this record holds for questions that have since been
  // removed/renamed — so historical feedback never silently loses data.
  const qFields = state.questionnaire.fields;
  const knownIds = new Set(qFields.map((f) => f.id));
  const SYSTEM_KEYS = new Set(["feedbackId","locationId","locationName","dateOfVisit","ratings","submittedAt","updatedAt","status","createdBy","deleted","deletedAt","deletedBy","editedBy","editHistory"]);
  const orphanKeys = Object.keys(r).filter((k) => !SYSTEM_KEYS.has(k) && !knownIds.has(k) && !(k.endsWith("Other") && knownIds.has(k.slice(0, -5))));
  const orphanRatingKeys = Object.keys(r.ratings || {}).filter((k) => !knownIds.has(k));
  const label = (f) => esc(en(f.label).replace(/\{location\}/g, r.locationName || "this location"));
  const rowFor = (f) => {
    if (f.type === "rating") return `<tr><th style="width:40%">${label(f)}</th><td><span class="rating-chip ${r.ratings?.[f.id]}">${r.ratings?.[f.id] || "-"}</span></td></tr>`;
    if (f.type === "choice") { let v = r[f.id] || "-"; if (r[f.id + "Other"]) v += " — " + r[f.id + "Other"]; return `<tr><th style="width:40%">${label(f)}</th><td>${esc(v)}</td></tr>`; }
    return `<tr><th style="width:40%">${label(f)}</th><td>${esc(r[f.id] || "-")}</td></tr>`;
  };
  const tableFields = qFields.filter((f) => f.type !== "textarea");
  const longFields = qFields.filter((f) => f.type === "textarea");
  const removedBadge = ` <span class="badge gray" style="margin-left:4px">removed question</span>`;
  main.innerHTML = `
    <div class="no-print" style="margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-outline btn-sm" id="backBtn">← Back to list</button>
      <button class="btn btn-outline btn-sm" id="printBtn">Print / Save as PDF</button>
      ${state.role==="admin" ? `<button class="btn btn-outline btn-sm" id="editBtn">Edit</button><button class="btn btn-danger btn-sm" id="delBtn">Delete</button>` : ""}
    </div>
    <div class="panel card" style="max-width:720px;margin:0 auto">
      <div style="text-align:center;margin-bottom:18px">
        <div style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)">${esc(state.orgName)}</div>
        <h2 style="margin:6px 0 0" class="serif">Guest Feedback Report</h2>
        <div style="color:var(--ink-soft);font-size:13px">Feedback ID: ${r.feedbackId}</div>
      </div>
      <table style="margin-bottom:16px">
        <tr><th style="width:40%">Location</th><td>${esc(r.locationName)}</td></tr>
        <tr><th>Date of Visit</th><td>${fmtDate(r.dateOfVisit)}</td></tr>
        ${tableFields.map(rowFor).join("")}
        ${orphanRatingKeys.map((k) => `<tr><th style="width:40%">${esc(catLabel(k))}${removedBadge}</th><td><span class="rating-chip ${r.ratings[k]}">${r.ratings[k] || "-"}</span></td></tr>`).join("")}
        ${orphanKeys.map((k) => `<tr><th style="width:40%">${esc(catLabel(k))}${removedBadge}</th><td>${esc(typeof r[k] === "object" ? JSON.stringify(r[k]) : r[k])}</td></tr>`).join("")}
        <tr><th>Submitted</th><td>${fmtDateTime(r.submittedAt)}</td></tr>
      </table>
      ${longFields.map((f) => `<h3>${label(f)}</h3><p style="white-space:pre-wrap">${esc(r[f.id] || "—")}</p>`).join("")}
      ${r.editedBy ? `<p style="font-size:12px;color:var(--ink-soft);margin-top:14px">Last edited ${fmtDateTime(r.updatedAt)}. Edits are recorded in the Audit Log.</p>` : ""}
    </div>`;
  document.getElementById("backBtn").addEventListener("click", () => history.back());
  document.getElementById("printBtn").addEventListener("click", () => window.print());
  if (state.role === "admin") {
    document.getElementById("editBtn").addEventListener("click", () => openEditFeedback(r));
    document.getElementById("delBtn").addEventListener("click", async () => {
      if (!confirm(`Delete feedback ${r.feedbackId}? This cannot be undone.`)) return;
      await Fs.deleteDoc(Fs.doc(db, "feedback", id));
      await writeAudit("Feedback deleted", id);
      toast("Feedback deleted.", "success");
      location.hash = "#/feedback";
    });
  }
}
function openEditFeedback(r) {
  const editable = state.questionnaire.fields.filter((f) => f.type === "text" || f.type === "textarea");
  openModal(`
    <h3>Edit Feedback ${r.feedbackId}</h3>
    ${editable.map((f) => `<div class="field"><label>${esc(en(f.label).replace(/\{location\}/g, r.locationName || "this location"))}</label>
      ${f.type === "textarea" ? `<textarea data-edit-id="${f.id}">${esc(r[f.id] || "")}</textarea>` : `<input data-edit-id="${f.id}" value="${esc(r[f.id] || "")}">`}</div>`).join("") || `<p style="color:var(--ink-soft)">There are no free-text questions to edit.</p>`}

}

function openLocationModal(loc) {
  const isEdit = !!loc;
  openModal(`
    <h3>${isEdit?"Edit":"Add"} Location</h3>

    <div class="field"><label>Location Name — العربية (optional)</label><input id="lNameAr" dir="rtl" class="ar-input" value="${esc(loc?.nameAr||"")}" placeholder="Shown to guests who choose Arabic; if empty, the English name is shown">`+`</div>

      fromDestinations = recips.filter((r) => r.active !== false && (r.locationIds || []).includes(loc.id)).map((r) => r.email);
    }
    const notifyEmails = mergeEmails(extraEmails, fromDestinations);

    else { data.createdAt = Fs.serverTimestamp(); await Fs.addDoc(Fs.collection(db,"locations"), data); }
    toast("Location saved.", "success"); closeModal(); router();
  });
}

function openUserModal(user, allUsers) {
  const isEdit = !!user;
  openModal(`
    <h3>${isEdit?"Edit":"Add"} User</h3>
    <div class="field"><label>Full Name</label><input id="uName" value="${esc(user?.fullName||"")}"></div>
    <div class="field"><label>Email</label><input id="uEmail" type="email" value="${esc(user?.email||"")}" ${isEdit?"disabled":""}></div>
    ${!isEdit?`<div class="field"><label>Password (min 8 characters)</label><input id="uPassword" type="password"></div>`:""}
    <div class="field"><label>Role</label><select id="uRole"><option value="user" ${user?.role==="user"?"selected":""}>User</option><option value="admin" ${user?.role==="admin"?"selected":""}>Admin</option></select></div>
    <div class="field" id="uLocWrap"><label>Assigned Locations (Users only)</label>
      <div class="checkbox-list">${state.locations.map((l)=>`<label><input type="checkbox" value="${l.id}" ${(user?.assignedLocationIds||[]).includes(l.id)?"checked":""}> ${esc(l.name)}</label>`).join("")}</div></div>
    <div class="modal-actions"><button class="btn btn-outline" id="uCancel">Cancel</button><button class="btn btn-gold" id="uSave">Save</button></div>`);
  const toggleLocWrap = () => { document.getElementById("uLocWrap").style.display = document.getElementById("uRole").value==="admin"?"none":"block"; };
  document.getElementById("uRole").addEventListener("change", toggleLocWrap); toggleLocWrap();
  document.getElementById("uCancel").addEventListener("click", closeModal);
  document.getElementById("uSave").addEventListener("click", async () => {
    const fullName = document.getElementById("uName").value.trim();
    const role = document.getElementById("uRole").value;
    const assignedLocationIds = Array.from(document.querySelectorAll("#uLocWrap input:checked")).map((c) => c.value);
    try {
      if (isEdit) {
        await Fs.updateDoc(Fs.doc(db,"users",user.id), { fullName, role, assignedLocationIds: role==="admin"?[]:assignedLocationIds, updatedAt: Fs.serverTimestamp() });
        await writeAudit("User edited", user.email);
      } else {
        const email = document.getElementById("uEmail").value.trim();
        const password = document.getElementById("uPassword").value;
        if (!email || password.length < 8) return toast("Valid email and 8+ character password required.", "error");
        if (allUsers.some((u) => u.email === email)) return toast("A user with this email already exists.", "error");
        const cred = await Auth.createUserWithEmailAndPassword(secondaryAuth, email, password);
        await Fs.setDoc(Fs.doc(db,"users",cred.user.uid), { fullName: fullName||email, email, role, assignedLocationIds: role==="admin"?[]:assignedLocationIds, active: true, createdAt: Fs.serverTimestamp(), updatedAt: Fs.serverTimestamp(), lastLoginAt: null });
        await secondaryAuth.signOut();
        await writeAudit("User created", `${email} (${role})`);
      }
      toast("User saved.", "success"); closeModal(); router();
    } catch (err) { console.error(err); toast(err.message || "Could not save user.", "error"); }
  });

// ---- Backup & Restore ------------------------------------------------------
async function viewBackup(main) {
  main.innerHTML = `
    <div class="panel card"><h3>Backup Now</h3>
      <p style="color:var(--ink-soft);font-size:13px">Downloads a JSON backup of feedback, locations, email destinations and settings (excludes login passwords).</p>
      <button class="btn btn-gold" id="backupBtn">Backup Now</button>
      <div id="backupResult" style="margin-top:12px;font-size:13.5px"></div>
    </div>
    <div class="panel card"><h3>Restore Backup</h3>
      <p style="color:var(--red);font-size:13.5px;font-weight:600">⚠ Restoring a backup may replace or modify existing system data. Please make sure you have created a current backup before continuing.</p>
      <input type="file" id="restoreFile" accept="application/json" style="margin-bottom:12px">
      <div id="restorePreview"></div>
    </div>`;
  document.getElementById("backupBtn").addEventListener("click", async () => {
    const btn = document.getElementById("backupBtn"); btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Backing up…`;
    try {
      const collections = ["feedback","locations","emailRecipients","settings"];
      const out = { createdAt: new Date().toISOString(), collections: {} }; let totalRecords = 0;
      for (const c of collections) { const snap = await Fs.getDocs(Fs.collection(db,c)); out.collections[c] = snap.docs.map((d)=>({id:d.id,data:d.data()})); totalRecords += out.collections[c].length; }
      const stamp = new Date().toISOString().replace(/[:.]/g,"-");
      downloadFile(`GuestFeedback_Backup_${stamp}.json`, JSON.stringify(out,null,2), "application/json");
      document.getElementById("backupResult").innerHTML = `<span class="badge green">Done</span> ${totalRecords} records backed up at ${new Date().toLocaleString()}.`;
      await writeAudit("Backup created", `${totalRecords} records`);
    } catch (err) { toast("Backup failed: " + err.message, "error"); }
    finally { btn.disabled = false; btn.textContent = "Backup Now"; }
  });
  document.getElementById("restoreFile").addEventListener("change", async (e) => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!data.collections || !data.collections.feedback) throw new Error("invalid");
      const counts = Object.fromEntries(Object.entries(data.collections).map(([k,v])=>[k,v.length]));
      document.getElementById("restorePreview").innerHTML = `
        <div class="card" style="padding:14px;margin-bottom:12px">
          <div><b>Backup date:</b> ${data.createdAt||"unknown"}</div>
          <div><b>Feedback records:</b> ${counts.feedback||0}</div>
          <div><b>Locations:</b> ${counts.locations||0}</div>
          <div><b>Email configurations:</b> ${counts.emailRecipients||0}</div>
        </div>
        <button class="btn btn-outline" id="mergeBtn">Merge Data (add missing only)</button>
        <button class="btn btn-danger" id="replaceBtn" style="margin-left:10px">Replace Data</button>`;
      document.getElementById("mergeBtn").addEventListener("click", () => runRestore(data, "merge"));
      document.getElementById("replaceBtn").addEventListener("click", () => runRestore(data, "replace"));
    } catch (err) { document.getElementById("restorePreview").innerHTML = `<p style="color:var(--red)">This file is not a valid backup and cannot be restored.</p>`; }
  });
}
async function runRestore(data, mode) {
  if (!confirm(mode==="replace" ? "This will REPLACE existing records with the backup. Continue?" : "This will ADD missing records from the backup without deleting existing data. Continue?")) return;
  let written = 0;
  for (const [coll, docs] of Object.entries(data.collections)) {
    for (const { id, data: docData } of docs) {
      const ref = Fs.doc(db, coll, id);
      if (mode === "merge") { const existing = await Fs.getDoc(ref); if (existing.exists()) continue; }
      await Fs.setDoc(ref, docData); written++;
    }
  }
  await writeAudit("Restore performed", `${mode}: ${written} records written`);
  toast(`Restore complete. ${written} records written.`, "success");
  loadLocations();
}

    const good = (m) => lines.push(`<div style="color:var(--green)">✓ ${m}</div>`);

      if (missing.length) bad(`Please fill in: <b>${missing.join(", ")}</b>.`); else good("Service ID, Template ID and Public Key are all filled in.");
      if (svc && !svc.startsWith("service_")) bad(`The Service ID normally starts with <code>service_</code> — yours is "${esc(svc)}". Check you copied the right one.`);
      if (tpl && !tpl.startsWith("template_")) bad(`The Template ID normally starts with <code>template_</code> — yours is "${esc(tpl)}". Check you copied the right one.`);
      // 2) saved? (the guest form only sees what is SAVED)
      const saved = (await Fs.getDoc(Fs.doc(db, "settings", "general"))).data() || {};
      if (svc && saved.emailjsServiceId === svc && saved.emailjsTemplateId === tpl && saved.emailjsPublicKey === key) good("These values are saved — the guest form is using them.");
      else bad("These values are <b>not saved yet</b>. The guest form only uses saved values — click <b>Save Branding &amp; Email Settings</b> (the button at the very bottom of this page).");
      // 2b) is the guest form people actually open the NEW version?
      const formUrl = val("ejsFormUrl");
      if (formUrl) {
        try {
          const res = await fetch(formUrl + (formUrl.includes("?") ? "&" : "?") + "nocache=" + Date.now(), { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const m = (await res.text()).match(/GFS_FORM_VERSION\s*=\s*(\d+)/);
          if (m && +m[1] >= 3) good("Your live guest form (feedback.html) is the up-to-date version.");
          else bad("Your <b>live guest form is an OLD version</b> — that is why new email names like <code>{{heard_about_us}}</code> stay empty. Upload the newest <b>feedback.html</b> to your website (replacing the old one), then reload it with Ctrl+F5 (on a phone, clear the browser's cache).");
        } catch (e) { lines.push(`<div style="color:var(--amber)">⚠ Couldn't read the guest form at that address (${esc(e.message || e)}). Check the address, and make sure you uploaded the newest feedback.html.</div>`); }
      } else lines.push(`<div style="color:var(--amber)">⚠ Type the web address of your guest form above so I can check it is the newest version.</div>`);
      // 3) locations
      const synced = await syncNotifyEmails();
      if (synced) good(`Updated the recipient list of ${synced} location(s) from your Email Destinations page.`);
      const active = state.locations.filter((l) => l.active);
      const withMail = active.filter((l) => (l.notifyEmails || []).length), without = active.filter((l) => !(l.notifyEmails || []).length);
      if (!active.length) bad("There are no active locations yet.");
      else if (!withMail.length) bad("<b>No location has anybody to send to</b>, so nothing is ever sent. Open the <b>Email Destinations</b> page, add each person, tick the locations they should hear about, and keep them <b>Enabled</b>.");
      else good(`Emails will be sent for: ${withMail.map((l) => `<b>${esc(l.name)}</b> → ${esc(l.notifyEmails.join(", "))}`).join("; ")}.`);
      if (withMail.length && without.length) lines.push(`<div style="color:var(--amber)">⚠ Nobody is assigned to: ${without.map((l) => esc(l.name)).join(", ")} — feedback for those locations won't send an email.</div>`);
      // 4) real test
      if (!window.emailjs) bad("The EmailJS script didn't load in this browser (an ad-blocker or firewall may be blocking <code>cdn.jsdelivr.net</code>).");
      else if (!missing.length && !to) bad("Type an email address in the box above to send the test to.");
      else if (!missing.length) {
        try {
          const res = await window.emailjs.send(svc, tpl, {
            to_email: to, email: to, to, recipient: to, subject: "TEST – New Guest Feedback – Sample Location – FB-TEST-000000",
            message: "This is a TEST email from your Guest Feedback system.\n\nIf you can read this, EmailJS is set up correctly.\n\nRATINGS\n• Service: Excellent\n• Food Quality: Average\n\nANSWERS\n• What did you like best?: The staff were wonderful.",
            location_name: "Sample Location (TEST)", feedback_id: "FB-TEST-000000", date_of_visit: new Date().toISOString().slice(0, 10).split("-").reverse().join("-"),
            from_name: "Test Guest", name: "Test Guest", server_name: "Sample Server", recommendation: "Yes",
            rating_menu: "Excellent", rating_food: "Average", rating_service: "Excellent", rating_atmosphere: "Excellent", rating_value: "Average", rating_overall: "Excellent",
            liked_best: "The staff were wonderful.", improvement_suggestion: "-", guest_name: "Test Guest", guest_contact: "-", guest_email: "-",
            ratings_summary: "Service: Excellent, Food Quality: Average", answers_summary: "What did you like best?: The staff were wonderful.",
            heard_about_us: "Friends", ...Object.fromEntries(state.questionnaire.fields.map((f) => ["answer_" + f.id, f.type === "rating" ? "Excellent" : "Sample answer"])),
          }, { publicKey: key });
          good(`EmailJS accepted the test email (status ${esc(res.status)}). Check the inbox of <b>${esc(to)}</b> — and its <b>Spam / Junk</b> folder — in the next minute.`);
        } catch (err) { bad("EmailJS did not send the test email."); lines.push(explainEmailJsError(err)); }
      }
    } catch (err) { bad("Something unexpected went wrong: " + esc(err.message || err)); }
    out.innerHTML = lines.join("");
    btn.disabled = false; btn.innerHTML = "Check &amp; Send Test Email";
  });

  // ---- Questionnaire Builder ----
  const TYPE_LABELS = { text: "Short text", textarea: "Long text", choice: "Choice", rating: "Rating" };
  let workingQ = cloneQ(state.questionnaire);
  const fillTexts = () => {
    document.getElementById("qHeaderTitle").value = en(workingQ.headerTitle); document.getElementById("qHeaderTitleAr").value = ar(workingQ.headerTitle);
    document.getElementById("qHeaderMessage").value = en(workingQ.headerMessage); document.getElementById("qHeaderMessageAr").value = ar(workingQ.headerMessage);
    document.getElementById("qFooterTitle").value = en(workingQ.footerTitle); document.getElementById("qFooterTitleAr").value = ar(workingQ.footerTitle);
    document.getElementById("qFooterMessage").value = en(workingQ.footerMessage); document.getElementById("qFooterMessageAr").value = ar(workingQ.footerMessage);
  };
  fillTexts();

  function renderFieldsEditor() {
    const list = document.getElementById("qFieldsList");
    const n = workingQ.fields.length;
    list.innerHTML = workingQ.fields.map((f, i) => `
      <div class="card" style="padding:14px;margin-bottom:10px">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
          <span class="badge gray">${i + 1}. ${TYPE_LABELS[f.type] || f.type}</span>
          <span style="font-size:11.5px;color:var(--ink-soft)" title="Use this name in your EmailJS template to show the answer to this question">Email name: <code>{{answer_${esc(f.id)}}}</code></span>
          <label style="display:flex;align-items:center;gap:6px;font-weight:500;font-size:13px;white-space:nowrap;margin:0;margin-inline-start:auto">
            <input type="checkbox" class="qReq" data-i="${i}" style="width:auto" ${f.required ? "checked" : ""}> Required
          </label>
        </div>
        <div class="bi-grid">
          <div><label>Question — English</label><input class="qLabel" data-i="${i}" value="${esc(en(f.label))}"></div>
          <div><label>Question — العربية</label><input class="qLabelAr ar-input" data-i="${i}" dir="rtl" value="${esc(ar(f.label))}"></div>
        </div>
        ${f.type === "choice" ? `<div class="bi-grid" style="margin-top:8px">
            <div><label>Answer options — English</label><input class="qOpts" data-i="${i}" value="${esc((f.options || []).map(en).join(", "))}" placeholder="Option 1, Option 2, Others"></div>
            <div><label>Answer options — العربية (same order)</label><input class="qOptsAr ar-input" data-i="${i}" dir="rtl" value="${esc((f.options || []).map(ar).join("، "))}" placeholder="الخيار 1، الخيار 2، أخرى"></div>
          </div>
          <div style="font-size:12px;color:var(--ink-soft);margin:6px 0 8px">Separate options with commas (the Arabic comma ، also works). Keep the Arabic in the <b>same order</b> as the English — the first Arabic option is the translation of the first English one, and so on. Include an option named <b>Others</b> to automatically show a "Please specify" box. Answers are always saved in English.</div>` : ""}
        ${f.type === "text" || f.type === "textarea" ? `<div class="bi-grid" style="margin-top:8px">
            <div><label>Hint text — English (optional)</label><input class="qPh" data-i="${i}" value="${esc(en(f.placeholder))}" placeholder="Shown inside the empty answer box"></div>
            <div><label>Hint text — العربية (optional)</label><input class="qPhAr ar-input" data-i="${i}" dir="rtl" value="${esc(ar(f.placeholder))}"></div>
          </div>` : ""}
        ${f.type === "text" ? `<select class="qIn" data-i="${i}" style="margin:8px 0" aria-label="Answer type">
            <option value="text" ${(f.inputType || "text") === "text" ? "selected" : ""}>Plain text</option>
            <option value="email" ${f.inputType === "email" ? "selected" : ""}>Email address (validated)</option>
            <option value="tel" ${f.inputType === "tel" ? "selected" : ""}>Phone number</option>
          </select>` : ""}
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-outline btn-sm qUp" data-i="${i}" ${i === 0 ? "disabled" : ""}>↑ Move up</button>
          <button class="btn btn-outline btn-sm qDown" data-i="${i}" ${i === n - 1 ? "disabled" : ""}>↓ Move down</button>
          <button class="btn btn-outline btn-sm qDel" data-i="${i}" style="color:var(--red);margin-left:auto">Delete</button>
        </div>
      </div>`).join("") || `<p style="color:var(--ink-soft);font-size:13px">No questions yet — add one below.</p>`;

    const setPair = (i, key, side, value) => { const f = workingQ.fields[i]; f[key] = { ...pair(f[key]), [side]: value }; };
    // Zips the English and Arabic option boxes together by position into [{en, ar}, ...]
    const syncOptions = (i) => {
      const split = (str) => str.split(/[,،]/).map((x) => x.trim()).filter(Boolean);
      const enOpts = split(list.querySelector(`.qOpts[data-i="${i}"]`).value);
      const arOpts = split(list.querySelector(`.qOptsAr[data-i="${i}"]`).value);
      workingQ.fields[i].options = enOpts.map((e, k) => ({ en: e, ar: arOpts[k] || "" }));
    };
    list.querySelectorAll(".qLabel").forEach((el) => el.addEventListener("input", (e) => setPair(+e.target.dataset.i, "label", "en", e.target.value)));
    list.querySelectorAll(".qLabelAr").forEach((el) => el.addEventListener("input", (e) => setPair(+e.target.dataset.i, "label", "ar", e.target.value)));
    list.querySelectorAll(".qReq").forEach((el) => el.addEventListener("change", (e) => { workingQ.fields[+e.target.dataset.i].required = e.target.checked; }));
    list.querySelectorAll(".qOpts, .qOptsAr").forEach((el) => el.addEventListener("input", (e) => syncOptions(+e.target.dataset.i)));
    list.querySelectorAll(".qPh").forEach((el) => el.addEventListener("input", (e) => setPair(+e.target.dataset.i, "placeholder", "en", e.target.value)));
    list.querySelectorAll(".qPhAr").forEach((el) => el.addEventListener("input", (e) => setPair(+e.target.dataset.i, "placeholder", "ar", e.target.value)));
    list.querySelectorAll(".qIn").forEach((el) => el.addEventListener("change", (e) => { workingQ.fields[+e.target.dataset.i].inputType = e.target.value; }));
    list.querySelectorAll(".qUp").forEach((b) => b.addEventListener("click", () => { const i = +b.dataset.i; [workingQ.fields[i - 1], workingQ.fields[i]] = [workingQ.fields[i], workingQ.fields[i - 1]]; renderFieldsEditor(); }));
    list.querySelectorAll(".qDown").forEach((b) => b.addEventListener("click", () => { const i = +b.dataset.i; [workingQ.fields[i + 1], workingQ.fields[i]] = [workingQ.fields[i], workingQ.fields[i + 1]]; renderFieldsEditor(); }));
    list.querySelectorAll(".qDel").forEach((b) => b.addEventListener("click", () => {
      const f = workingQ.fields[+b.dataset.i];
      if (!confirm(`Delete this question?\n\n"${en(f.label)}"\n\nGuests will no longer be asked it. Answers already collected are kept.`)) return;
      workingQ.fields.splice(+b.dataset.i, 1); renderFieldsEditor();
    }));
  }
  renderFieldsEditor();

  document.getElementById("qAddBtn").addEventListener("click", () => {
    const labelEn = document.getElementById("qNewLabel").value.trim();
    const labelAr = document.getElementById("qNewLabelAr").value.trim();
    if (!labelEn) return toast("Type the question in English first (add the Arabic version too if you have it).", "error");
    const type = document.getElementById("qNewType").value;
    const field = { id: toCamelId(labelEn, workingQ.fields.map((f) => f.id)), type, label: { en: labelEn, ar: labelAr }, required: type === "rating" };
    if (type === "choice") field.options = [{ en: "Option 1", ar: "" }, { en: "Option 2", ar: "" }];
    if (type === "text") field.inputType = "text";
    if (type === "text" || type === "textarea") field.placeholder = { en: "", ar: "" };
    workingQ.fields.push(field);
    document.getElementById("qNewLabel").value = ""; document.getElementById("qNewLabelAr").value = "";
    renderFieldsEditor();
    toast("Question added at the bottom — use ↑ to move it where you want.", "success");
  });
  document.getElementById("qNewLabel").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); document.getElementById("qAddBtn").click(); } });

  document.getElementById("qResetBtn").addEventListener("click", () => {
    if (!confirm("Reset the whole questionnaire (header, questions, thank-you message) back to the original default? You still need to click Save afterwards.")) return;
    workingQ = cloneQ(DEFAULT_QUESTIONNAIRE);
    fillTexts();
    renderFieldsEditor();
  });

  document.getElementById("qSaveBtn").addEventListener("click", async () => {
    const v = (id) => document.getElementById(id).value.trim();
    workingQ.headerTitle = { en: v("qHeaderTitle"), ar: v("qHeaderTitleAr") };
    workingQ.headerMessage = { en: v("qHeaderMessage"), ar: v("qHeaderMessageAr") };
    workingQ.footerTitle = { en: v("qFooterTitle"), ar: v("qFooterTitleAr") };
    workingQ.footerMessage = { en: v("qFooterMessage"), ar: v("qFooterMessageAr") };
    if (!workingQ.headerTitle.en) return toast("The English header title can't be empty.", "error");
    if (workingQ.fields.some((f) => !en(f.label).trim())) return toast("Every question needs its English text (the Arabic is optional).", "error");
    if (workingQ.fields.some((f) => f.type === "choice" && (f.options || []).length < 2)) return toast("Choice questions need at least 2 answer options.", "error");
    const badOpts = workingQ.fields.find((f) => f.type === "choice" && (f.options || []).some((o) => ar(o)) && (f.options || []).some((o) => !ar(o)));
    if (badOpts) toast(`Heads up: "${en(badOpts.label)}" has Arabic for only some of its options — the others will show in English to Arabic guests. Check the Arabic list has the same number of items as the English.`, "error");
    const btn = document.getElementById("qSaveBtn"); btn.disabled = true;
    try {
      await Fs.setDoc(Fs.doc(db, "settings", "questionnaire"), {
        headerTitle: workingQ.headerTitle, headerMessage: workingQ.headerMessage,
        footerTitle: workingQ.footerTitle, footerMessage: workingQ.footerMessage,
        fields: workingQ.fields, updatedAt: Fs.serverTimestamp(),
      }, { merge: true });
      state.questionnaire = cloneQ(workingQ);
      await writeAudit("Questionnaire updated", `${workingQ.fields.length} questions`);
      toast("Questionnaire saved. New guest submissions will use it.", "success");
    } catch (err) { console.error(err); toast("Could not save: " + err.message, "error"); }
    finally { btn.disabled = false; }
  });
}

// ---- Audit Log ------------------------------------------------------
async function viewAudit(main) {
  const snap = await Fs.getDocs(Fs.query(Fs.collection(db,"auditLogs"), Fs.orderBy("at","desc"), Fs.limit(200)));
  const logs = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  const sel = new Set();
  main.innerHTML = `<div class="panel card"><h3>Audit Log</h3>
    <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
      <button class="btn btn-outline btn-sm" id="aSelAll">Select all shown</button>
      <button class="btn btn-outline btn-sm" id="aSelNone">Clear selection</button>
      <button class="btn btn-danger btn-sm" id="aDelSel" disabled>Delete selected (0)</button>
      <button class="btn btn-outline btn-sm" id="aDelAll" style="color:var(--red);margin-left:auto">Delete ALL audit entries…</button>
    </div>
    ${logs.length >= 200 ? `<p style="font-size:12.5px;color:var(--ink-soft);margin-top:-4px">Showing the 200 most recent entries.</p>` : ""}
    <div class="table-scroll"><table>
    <thead><tr><th style="width:34px"><input type="checkbox" id="aChkAll" aria-label="Select all shown" style="width:auto"></th><th>Date/Time</th><th>User</th><th>Action</th><th>Detail</th></tr></thead>
    <tbody>${logs.map((l)=>`<tr><td><input type="checkbox" class="aSel" data-id="${esc(l.id)}" aria-label="Select entry" style="width:auto"></td><td>${fmtDateTime(l.at)}</td><td>${esc(l.userEmail||l.userId)}</td><td>${esc(l.action)}</td><td style="white-space:normal">${esc(l.detail)}</td></tr>`).join("")||`<tr><td colspan="5">No audit entries yet.</td></tr>`}</tbody>
  </table></div></div>`;

  const refresh = () => {
    document.querySelectorAll(".aSel").forEach((c) => { c.checked = sel.has(c.dataset.id); });
    const b = document.getElementById("aDelSel"); b.disabled = sel.size === 0; b.textContent = `Delete selected (${sel.size})`;
    document.getElementById("aChkAll").checked = logs.length > 0 && logs.every((l) => sel.has(l.id));
  };
  const finished = async (n, what) => {
    await writeAudit("Audit log entries deleted", `${plural(n, "entry", "entries")} removed (${what})`);
    toast(`${plural(n, "audit entry", "audit entries")} deleted.`, "success");
    router();
  };
  document.querySelectorAll(".aSel").forEach((c) => c.addEventListener("change", () => { c.checked ? sel.add(c.dataset.id) : sel.delete(c.dataset.id); refresh(); }));
  document.getElementById("aChkAll").addEventListener("change", (e) => { logs.forEach((l) => e.target.checked ? sel.add(l.id) : sel.delete(l.id)); refresh(); });
  document.getElementById("aSelAll").addEventListener("click", () => { logs.forEach((l) => sel.add(l.id)); refresh(); });
  document.getElementById("aSelNone").addEventListener("click", () => { sel.clear(); refresh(); });
  document.getElementById("aDelSel").addEventListener("click", () => {
    const ids = [...sel]; if (!ids.length) return;
    confirmDeleteModal({
      title: `Delete ${plural(ids.length, "selected audit entry", "selected audit entries")}?`,
      message: `You are about to permanently delete <b>${plural(ids.length, "audit log entry", "audit log entries")}</b>. This cannot be undone. (A new entry recording this deletion will be added.)`,
      coll: "auditLogs", count: ids.length, requireTyping: ids.length > 10, backupFile: "audit-log",
      loadItems: async () => logs.filter((l) => sel.has(l.id)).map(({ id, ...data }) => ({ id, data })),
      onDone: (deleted) => finished(deleted.length, "selected"),
    });
  });
  document.getElementById("aDelAll").addEventListener("click", () => {
    confirmDeleteModal({
      title: "Delete ALL audit entries?",
      message: `This permanently erases the <b>entire audit log</b> — the full history of who changed what, not just the entries on screen. <b>This cannot be undone.</b> (One new entry recording this deletion will remain.)`,
      coll: "auditLogs", count: null, requireTyping: true, backupFile: "audit-log_ALL",
      loadItems: async () => (await Fs.getDocs(Fs.collection(db, "auditLogs"))).docs.map((d) => ({ id: d.id, data: d.data() })),
      onDone: (deleted) => finished(deleted.length, "ALL"),
    });
  });
}
</script>
